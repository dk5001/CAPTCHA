<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.10.0/p5.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
    <script src="config.js"></script>
    <script src="p5.comfyui-helper.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CAPTCHA 2.0</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        overflow-y: auto;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        background-color: #000000;
        font-family: Arial, sans-serif;
      }

      #interface-container {
        position: relative;
        width: 100%;
        max-width: 800px;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Checkbox Interface */
      #checkbox-interface {
        position: absolute;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
      }

      .checkbox-container {
        width: min(480px, 90vw);
        min-height: 80px;
        background-color: #f0f0f0;
        border-radius: 10px;
        display: flex;
        align-items: center;
        padding: 16px 20px;
        box-sizing: border-box;
      }

      .checkbox-wrapper {
        display: flex;
        align-items: center;
        flex: 1;
        min-width: 0;
      }

      .checkbox {
        width: 30px;
        height: 30px;
        flex-shrink: 0;
        border: 2px solid #000;
        background-color: #000;
        margin-right: clamp(14px, 5vw, 40px);
        position: relative;
        cursor: pointer;
      }

      .checkbox.checked::after {
        content: "";
        position: absolute;
        top: 5px;
        left: 5px;
        width: 20px;
        height: 20px;
        background-color: #fff;
      }

      .checkbox-text {
        font-size: clamp(16px, 5vw, 24px);
        color: #000;
      }

      .cog-icon {
        width: clamp(56px, 12vw, 100px);
        height: clamp(56px, 12vw, 100px);
        margin-left: auto;
        flex-shrink: 0;
      }

      /* Question Interface */
      #question-interface {
        position: absolute;
        width: 100%;
        height: 100%;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }

      .question-container {
        width: min(480px, 90vw);
        background-color: #f0f0f0;
        border-radius: 10px;
        padding: 24px 20px;
        text-align: center;
        box-sizing: border-box;
      }

      .question-text {
        font-size: clamp(18px, 5vw, 28px);
        color: #000;
        margin-bottom: 24px;
      }

      .question-input {
        width: 100%;
        padding: 12px;
        font-size: clamp(16px, 4vw, 20px);
        border: 2px solid #000;
        border-radius: 5px;
        margin-bottom: 20px;
        box-sizing: border-box;
      }

      .question-back-button {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background-color: rgba(10, 10, 10, 0.6);
        color: white;
        padding: 10px 20px;
        border-radius: 25px;
        cursor: pointer;
        border: 2px solid #646464;
        outline: 2px solid white;
      }

      /* Grid Interface */
      #grid-interface {
        position: absolute;
        width: 100%;
        height: 100%;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .header {
        width: 100%;
        min-height: 80px;
        background-color: #646464;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px 20px;
        margin-bottom: clamp(16px, 4vw, 40px);
        box-sizing: border-box;
      }

      .header-text {
        color: white;
        font-size: clamp(18px, 4.5vw, 36px);
        text-align: center;
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: clamp(4px, 1.5vw, 10px);
        width: min(630px, 96vw);
      }

      .grid-item {
        aspect-ratio: 1;
        border: 3px solid white;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        background-color: #1a1a1a; /* placeholder while image loads */
      }

      .grid-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.25s ease;
      }

      .grid-item img.img-loaded {
        opacity: 1;
      }

      .grid-item.selected::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(100, 0, 0, 0.4);
      }

      .shuffle-button {
        position: absolute;
        bottom: 20px;
        right: 20px;
        background-color: rgba(10, 10, 10, 0.6);
        color: white;
        padding: 10px 20px;
        border-radius: 25px;
        cursor: pointer;
        border: 2px solid #646464;
        outline: 2px solid white;
      }

      .back-button {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background-color: rgba(10, 10, 10, 0.6);
        color: white;
        padding: 10px 20px;
        border-radius: 25px;
        cursor: pointer;
        border: 2px solid #646464;
        outline: 2px solid white;
      }

      .countdown {
        position: relative;
        width: 100%;
        text-align: center;
        color: black;
        font-size: clamp(14px, 4vw, 24px);
        opacity: 0;
        transition: opacity 0.3s;
        margin: 8px 0;
      }

      .countdown.visible {
        opacity: 1;
      }

      /* Receipt interface */
      #receipt-interface {
        position: fixed;
        inset: 0;
        overflow-y: auto;
        background-color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 16px;
        box-sizing: border-box;
        z-index: 100;
      }

      .receipt-header {
        font-size: clamp(20px, 5vw, 32px);
        font-weight: bold;
        margin-bottom: 16px;
        text-align: center;
      }

      .receipt-meta {
        width: 100%;
        display: flex;
        justify-content: center;
        gap: clamp(16px, 5vw, 40px);
        margin-bottom: 16px;
        flex-wrap: wrap;
        font-size: clamp(13px, 3vw, 16px);
      }

      .receipt-user-id {
        font-weight: bold;
        font-size: clamp(14px, 4vw, 19px);
        color: #cc0000;
        text-align: center;
      }

      .receipt-images {
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        gap: clamp(6px, 2vw, 14px);
        margin-bottom: 24px;
        width: 100%;
      }

      .receipt-image-block {
        flex: 1;
        min-width: 0;
        text-align: center;
        font-size: clamp(11px, 2.5vw, 15px);
      }

      .receipt-image-block h3 {
        margin: 0 0 6px 0;
        font-size: clamp(11px, 3vw, 16px);
      }

      .receipt-img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border: 1px solid #ccc;
        display: block;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .receipt-img.img-loaded {
        opacity: 1;
      }

      .receipt-img-placeholder {
        width: 100%;
        aspect-ratio: 1;
        border: 1px solid #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(11px, 3vw, 14px);
        color: #666;
      }

      .receipt-footer {
        text-align: center;
        margin-top: 8px;
        font-size: clamp(13px, 3vw, 16px);
      }

      .receipt-footer p {
        margin: 6px 0;
      }

      .receipt-reset-btn {
        background-color: #0066cc;
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 5px;
        margin-top: 16px;
        cursor: pointer;
        font-weight: bold;
        font-size: clamp(14px, 3.5vw, 16px);
      }

      /* Loading state */
      .loading-images {
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        gap: clamp(6px, 2vw, 14px);
        margin-top: 20px;
        width: 100%;
      }

      .loading-img-block {
        flex: 1;
        min-width: 0;
        text-align: center;
        font-size: clamp(11px, 2.5vw, 15px);
      }

      .loading-img-block h3 {
        margin: 0 0 6px 0;
        font-size: clamp(11px, 3vw, 16px);
      }

      .loading-thumb {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        position: relative;
        border: 1px solid #ccc;
        overflow: hidden;
      }

      .loading-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .loading-thumb-placeholder {
        width: 100%;
        aspect-ratio: 1;
        border: 2px dashed #999;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(10px, 2.5vw, 13px);
        color: #999;
        animation: pulse-placeholder 1.5s ease-in-out infinite;
        box-sizing: border-box;
      }

      @keyframes pulse-placeholder {
        0%, 100% { border-color: #ccc; color: #ccc; }
        50% { border-color: #666; color: #666; }
      }
    </style>
  </head>
  <body>
    <div id="interface-container">
      <!-- Checkbox Interface -->
      <div id="checkbox-interface">
        <div class="checkbox-container">
          <div class="checkbox-wrapper">
            <div class="checkbox" id="rational-checkbox"></div>
            <div class="checkbox-text">Want to see your face?</div>
          </div>
          <img src="cog.png" class="cog-icon" alt="Cog icon">
        </div>
      </div>

      <!-- Question Interface -->
      <div id="question-interface">

        </div>
        <div class="question-back-button" id="question-back-button">Back</div>

      <!-- Grid Interface -->
      <div id="grid-interface">
        <div class="header">

        <div class="grid-container" id="grid-container">
          <!-- Grid items will be added dynamically -->
        </div>
        <div class="shuffle-button" id="shuffle-button">Shuffle</div>
        <div class="back-button" id="back-button">Back</div>
      </div>
    </div>

      // State variables

      // ── Supabase helpers ────────────────────────────────────────────────────
      async function sbGet(path) {
        const res = await fetch(SUPABASE_URL + path, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        });
        if (!res.ok) throw new Error('Supabase GET ' + res.status);
        return res.json();
      }

      // Fetch image blob from ComfyUI and upload to Supabase Storage; returns CDN URL
      async function sbUploadImage(comfyUrl, filename) {
        const blob = await fetch(comfyUrl).then(r => {
          if (!r.ok) throw new Error('ComfyUI fetch ' + r.status);
          return r.blob();
        });
        debug('Blob type: ' + blob.type + ', size: ' + blob.size);
        const up = await fetch(SUPABASE_URL + '/storage/v1/object/faces/' + filename, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': blob.type || 'image/png',
            'x-upsert': 'true'
          },
          body: blob
        });
        if (!up.ok) {
          const errText = await up.text();
          throw new Error('Storage upload ' + up.status + ': ' + errText);
        }
        return SUPABASE_URL + '/storage/v1/object/public/faces/' + filename;

      // Upload image to Storage + insert row — runs fire-and-forget after generation
      async function saveToSupabase(comfyUrl, prompt, sessionId) {
        try {
          const cdnUrl = await sbUploadImage(comfyUrl, sessionId + '.png');
          const ins = await fetch(SUPABASE_URL + '/rest/v1/generations', {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + SUPABASE_KEY,
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({ generated_url: cdnUrl, prompt: prompt, session_id: sessionId })
          });
          if (!ins.ok) throw new Error('DB insert ' + ins.status);
          // Swap the tunnel URL → CDN URL in the local pool so grid uses fast CDN
          const idx = images.indexOf(comfyUrl);
          if (idx !== -1) { images[idx] = cdnUrl; initializeGrid(); }
          debug('Saved to Supabase CDN: ' + cdnUrl);
        } catch (e) {
          debug('Supabase save failed: ' + e.message);
        }
      }

      // Load past generated images — Supabase primary, ComfyUI fallback
      const MAX_GENERATED = 30; // FIFO cap — oldest dropped when exceeded
      let _syncInProgress = false;
      async function syncHistoryFromComfyUI() {
        if (_syncInProgress) return;
        _syncInProgress = true;
        try {
          await _doSync();
        } finally {
          _syncInProgress = false;
        }
      }

      async function _doSync() {
        // ── Supabase (primary) ────────────────────────────────────────────────
        try {
          const rows = await sbGet('/rest/v1/generations?select=generated_url&order=created_at.asc&limit=30');
          const seen = new Set(images);
          let added = 0;
          for (const row of rows) {
            if (row.generated_url && !seen.has(row.generated_url)) {
              images.push(row.generated_url);
              seen.add(row.generated_url);
              added++;
            }
          }
          const gen = images.slice(config.imageCount);
          if (gen.length > MAX_GENERATED) images.splice(config.imageCount, gen.length - MAX_GENERATED);
          debug('Synced ' + added + ' from Supabase, total: ' + (images.length - config.imageCount));
          _initialSyncDone = true;
          initializeGrid(); // always rebuild — replaces grey cells with real data
          return; // success — skip ComfyUI fallback
        } catch (e) {
          debug('Supabase sync failed (' + e.message + '), falling back to ComfyUI history');
        }

        // ── ComfyUI history (fallback) ────────────────────────────────────────
        if (!COMFY_URL) return;
        try {
          const res = await fetch(COMFY_URL + "/history?max_items=30");
          if (!res.ok) return;
          const history = await res.json();
          const seen = new Set(images);
          let added = 0;
          for (const promptId in history) {
            const outputs = history[promptId].outputs;
            if (!outputs) continue;
            for (const nodeId in outputs) {
              const imgs = outputs[nodeId].images;
              if (!imgs) continue;
              for (const img of imgs) {
                if (img.type !== "output") continue;
                const url = COMFY_URL + "/view?filename=" + encodeURIComponent(img.filename) +
                  "&subfolder=" + encodeURIComponent(img.subfolder || "") + "&type=output";
                if (!seen.has(url)) { images.push(url); seen.add(url); added++; }
              }
            }
          }
          const gen = images.slice(config.imageCount);
          if (gen.length > MAX_GENERATED) images.splice(config.imageCount, gen.length - MAX_GENERATED);
          debug("ComfyUI fallback synced " + added + " images");
          _initialSyncDone = true;
          initializeGrid();
        } catch (e) {
          debug("ComfyUI history sync failed: " + e.message);
          _initialSyncDone = true; // sync failed entirely — unlock placeholders
          initializeGrid();
        }
      }

      // Load all images
      function preloadImages() {
        debug("Preloading images");
        for (let i = 1; i <= config.imageCount; i++) {
          let paddedIndex = String(i).padStart(2, '0');
          let imgPath = `images/img${paddedIndex}.png`;
          images.push(imgPath);
        }
        debug(`Preloaded ${images.length} images`);
      }
      
      // Initialize the grid with random images
      function initializeGrid() {
        debug("Initializing grid");
        const gridContainer = document.getElementById('grid-container');
        gridContainer.innerHTML = '';
        
        const gridSlots = config.gridSize * config.gridSize;
        const localImgs = images.slice(0, config.imageCount);
        const generatedImgs = [...new Set(images.slice(config.imageCount))];

        if (shuffleMode) {
          const pool = generatedImgs.length >= gridSlots
            ? generatedImgs
            : [...new Set(images)];
          displayedImages = shuffleArray([...pool]).slice(0, gridSlots);
        } else {
          const recentGenerated = generatedImgs.slice(-gridSlots).reverse();
          if (recentGenerated.length >= gridSlots) {
            displayedImages = recentGenerated;
          } else if (recentGenerated.length > 0) {
            // Mix: recent generated + placeholder fill
            const fillCount = gridSlots - recentGenerated.length;
            const localFill = shuffleArray([...localImgs]).slice(0, fillCount);
            displayedImages = [...recentGenerated, ...localFill];
          } else if (_initialSyncDone) {
            // Sync finished but no generated images — fall back to placeholders
            displayedImages = shuffleArray([...localImgs]).slice(0, gridSlots);
          } else {
            // Sync still in flight — show empty grey cells, not clickable
            displayedImages = new Array(gridSlots).fill(null);
          }
        }

        // Create grid items
        for (let i = 0; i < gridSlots; i++) {
          const gridItem = document.createElement('div');
          gridItem.className = 'grid-item';
          gridItem.dataset.index = i;

          if (displayedImages[i]) {
            const img = document.createElement('img');
            img.alt = `Image ${i+1}`;
            img.style.filter = 'grayscale(100%)';
            img.onload = () => img.classList.add('img-loaded');
            img.onerror = () => img.classList.add('img-loaded');
            img.src = displayedImages[i];
            gridItem.appendChild(img);
            gridItem.addEventListener('click', handleTileClick);
          } else {
            gridItem.style.cursor = 'default'; // empty cell while loading
          }

          gridContainer.appendChild(gridItem);
        }

        // Prefetch real images into browser cache
        displayedImages.forEach(url => { if (url) { const p = new Image(); p.src = url; } });

        debug("Grid initialized with images");
      }

            function initWebcam() {
        debug("Initializing webcam");

        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
          debug("ERROR: MediaDevices.enumerateDevices() not supported in this browser");
          // Try with just getUserMedia directly as fallback
          initWebcamDirectly();
          return;
        }

        // Request permission first — prefer front camera on mobile
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        navigator.mediaDevices.getUserMedia({ video: isMobile ? { facingMode: "user" } : true })
          .then(function(stream) {
            debug("Initial camera permission granted - now will enumerate devices");
            // Stop this initial stream - we'll create a new one after selecting the right camera
            stream.getTracks().forEach(track => track.stop());
            
            // Now enumerate all devices
            return navigator.mediaDevices.enumerateDevices();
          })
          .then(function(devices) {
            debug("Available media devices:");
            
            // Find video devices (webcams)
            const videoDevices = devices.filter(device => device.kind === 'videoinput');
            if (videoDevices.length === 0) {
              debug("No video input devices found!");
              initWebcamDirectly();
              return;
            }
            
            // Log all video devices
            videoDevices.forEach((device, index) => {
              debug(`Webcam ${index}: ${device.label || 'Camera ' + (index + 1)} (${device.deviceId})`);
            });
            
            // Always use camera index 0 if available
            const cameraIndex = 0;
            const selectedCamera = videoDevices[cameraIndex].deviceId;
            debug(`Selecting camera: ${cameraIndex} (${selectedCamera})`);
            
            // Request access to the selected camera
            return navigator.mediaDevices.getUserMedia({
              video: {
          deviceId: {exact: selectedCamera},
          width: { ideal: 1280 },
          height: { ideal: 720 }
              }
            });
          })
          .then(function(stream) {
            debug("Camera access granted");
            setupVideoElement(stream);
          })
          .catch(function(error) {
            debug("Error during camera selection: " + error.message);
            debug("Falling back to default camera");
            initWebcamDirectly();
          });
            }
            
            function initWebcamDirectly() {
        debug("Trying to initialize webcam directly without device selection");
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: isMobile ? "user" : undefined,
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        })
        .then(function(stream) {
          debug("Default webcam access granted");
          setupVideoElement(stream);
        })
        .catch(function(error) {
          debug("Error with ideal constraints: " + error.message);
          debug("Trying with minimal constraints");
          navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
              debug("Minimal webcam access granted");
              setupVideoElement(stream);
            })
            .catch(function(err) {
               debug("CRITICAL ERROR: Cannot access any webcam: " + err.message);
            });
        });
            }

            function setupVideoElement(stream) {
        video = document.createElement('video');
        video.srcObject = stream;
        video.autoplay = true;
        video.muted = true;
        
        // Apply rotation: 90 degrees clockwise + horizontal flip
        video.style.transform = 'scaleX(-1)';
        
        // Apply CSS filter to make the video black and white
        video.style.filter = 'grayscale(100%)';
        
        // Ensure video is ready to use
        video.addEventListener('loadedmetadata', function() {
          debug("Video metadata loaded");
          video.play().catch(e => debug("Video play error: " + e.message));
        });
        
        // Add a button to toggle between cameras (for testing)
        addCameraSwitchButton();
            }

          switchButton.style.borderRadius = '6px';
          switchButton.style.fontSize = '14px';
          switchButton.style.boxShadow = '0 6px 18px rgba(0,0,0,0.6)';
          switchButton.style.display = 'none'; // hidden until debug mode (press D)
          document.body.appendChild(switchButton);
        } else {
          // Leave visibility managed by debug mode toggle; don't force show
          if (!document.body.contains(switchButton)) document.body.appendChild(switchButton);
        }

        // Attach handler once
        if (switchButton.dataset && switchButton.dataset.hasHandler === '1') return;
        switchButton.dataset = switchButton.dataset || {};
        switchButton.dataset.hasHandler = '1';

        switchButton.addEventListener('click', function() {
                debug('Camera switch button clicked');

          // Small status UI
          let statusEl = document.getElementById('camera-switch-status');
          if (!statusEl) {
            statusEl = document.createElement('div');
            statusEl.id = 'camera-switch-status';
            statusEl.style.position = 'fixed';
            statusEl.style.bottom = '48px';
            statusEl.style.right = '10px';
            statusEl.style.zIndex = '10000';
            statusEl.style.padding = '6px 8px';
            statusEl.style.backgroundColor = 'rgba(0,0,0,0.6)';
            statusEl.style.color = 'white';
            statusEl.style.borderRadius = '4px';
            statusEl.style.fontSize = '12px';
            document.body.appendChild(statusEl);
          }
          statusEl.textContent = 'Attempting camera switch...';

          // Determine current camera id
          let currentCameraId = null;
          if (video && video.srcObject) {
            const tracks = video.srcObject.getVideoTracks();
            if (tracks.length) currentCameraId = tracks[0].getSettings().deviceId;
          }

          navigator.mediaDevices.enumerateDevices()
            .then(function(devices) {
              const videoDevices = devices.filter(d => d.kind === 'videoinput');
              debug('Found ' + videoDevices.length + ' video devices');

              if (videoDevices.length <= 1) {
                statusEl.textContent = 'No alternate camera found — retrying default...';
                return navigator.mediaDevices.getUserMedia({ video: true });
              }

              // Stop current stream before switching
              if (video && video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());

              let currentIndex = -1;
              if (currentCameraId) currentIndex = videoDevices.findIndex(d => d.deviceId === currentCameraId);
              let nextIndex = currentIndex === 0 ? 1 : 0;
              if (nextIndex >= videoDevices.length) nextIndex = 0;
              const nextCameraId = videoDevices[nextIndex].deviceId;
              debug('Switching to camera index: ' + nextIndex);
              statusEl.textContent = 'Switching camera...';

              return new Promise(resolve => setTimeout(() => resolve(nextCameraId), 200));
            })
            .then(function(nextCameraId) {
              if (!nextCameraId) return null;
              return navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: nextCameraId }, width: { ideal: 1280 }, height: { ideal: 720 } } });
            })
            .then(function(stream) {
              if (!stream) return;
              if (video) {
                video.srcObject = stream;
                video.play().catch(e => debug('Video play error: ' + e.message));
              } else {
                setupVideoElement(stream);
              }
              statusEl.textContent = 'Camera switched';
              setTimeout(() => statusEl.remove(), 1200);
              const activeVideos = document.querySelectorAll('.grid-item.webcam-active video');
              activeVideos.forEach(v => { v.srcObject = stream; v.play().catch(() => {}); });
            })
            .catch(function(err) {
              debug('Switch error: ' + err.message);
              // Try minimal recovery
              navigator.mediaDevices.getUserMedia({ video: true })
                .then(function(stream) {
                  if (video) { video.srcObject = stream; video.play().catch(() => {}); }
                  else { setupVideoElement(stream); }
                  statusEl.textContent = 'Recovered default camera';
                  setTimeout(() => statusEl.remove(), 1200);
                })
                .catch(function(e) {
                  debug('Recovery failed: ' + e.message);
                  statusEl.textContent = 'No camera available. Click to retry.';
                  statusEl.style.cursor = 'pointer';
                  statusEl.onclick = function() { statusEl.textContent = 'Retrying...'; statusEl.onclick = null; switchButton.click(); };
                });
            });
        });
      }

      // Shuffle array using Fisher-Yates algorithm
      function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }
      
      // Handle tile click

        const allTiles = document.querySelectorAll('.grid-item');
        const clickedTile = event.currentTarget;
        
        // If the clicked tile is already selected, deselect it
        if (clickedTile.classList.contains('selected')) {

          clickedTile.classList.remove('selected');
          clickedTile.classList.remove('webcam-active');

          // Remove webcam if it exists
          const videoElement = clickedTile.querySelector('video');
          if (videoElement) {

        allTiles.forEach(tile => {

          const videoElement = tile.querySelector('video');
          if (videoElement) {

      // Start countdown timer
      function startCountdown(selectedTile) {
        debug("Starting countdown");
        const countdownElement = document.getElementById('countdown');

        countdownTimer = setInterval(() => {

          // At 1 second into the countdown (2 seconds left), show webcam
          if (elapsed >= 1000 && !selectedTile.classList.contains('webcam-active')) {

      // Capture image from webcam
      function captureImage(selectedTile) {
        debug("Capturing image");

        if (!video || !video.srcObject) {
          debug("Video not available for capture");
          return;
        }

        // Resume video if mobile browser paused it
        if (video.paused) {
          video.play().catch(e => debug("Video resume before capture: " + e.message));
        }
        
        // Create a canvas to capture the webcam image
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        
        try {
          const videoWidth = video.videoWidth;
          const videoHeight = video.videoHeight;
          
          debug(`Original video dimensions: ${videoWidth} x ${videoHeight}`);
          
          // Calculate square crop dimensions (use the smaller dimension)
          const cropSize = Math.min(videoWidth, videoHeight);
          
          // Calculate crop offset to center the crop area
          const cropX = (videoWidth - cropSize) / 2;
          const cropY = (videoHeight - cropSize) / 2;
          
          debug(`Cropping ${cropSize}x${cropSize} from center (offset: ${cropX}, ${cropY})`);
          
          // Set canvas to square
          canvas.width = cropSize;
          canvas.height = cropSize;
          
          debug(`Canvas created: ${canvas.width} x ${canvas.height}`);
          
          // Draw the video frame to the canvas (flipped horizontally, center-cropped)
          context.translate(canvas.width, 0);
          context.scale(-1, 1);
          // drawImage(image, sx, sy, sWidth, sHeight, dx, dy, dWidth, dHeight)
          // sx, sy: source crop position | sWidth, sHeight: source crop size
          // dx, dy: destination position | dWidth, dHeight: destination size
          context.drawImage(video, cropX, cropY, cropSize, cropSize, 0, 0, cropSize, cropSize);
          
          // Convert to black and white
          const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
          const data = imageData.data;
          
          for (let i = 0; i < data.length; i += 4) {
            const gray = (data[i] + data[i + 1] + data[i + 2]) / 3;
            data[i] = gray;
            data[i + 1] = gray;
            data[i + 2] = gray;
          }
          
          context.putImageData(imageData, 0, 0);
          
          // Create an image from the canvas
          const capturedImage = new Image();
          capturedImage.onload = function() {
            // Mark as loaded immediately — data URLs are already decoded, no fade needed
            capturedImage.classList.add('img-loaded');

            // Append captured image FIRST so there's no black gap
            selectedTile.appendChild(capturedImage);

            // Now remove the video and original image underneath
            const videoElement = selectedTile.querySelector('video');
            if (videoElement) videoElement.remove();
            const originalImage = selectedTile.querySelector('img:not([class*="img-loaded"])');
            if (originalImage && originalImage !== capturedImage) originalImage.remove();

            selectedTile.classList.remove('webcam-active');
            
            debug("Image captured and displayed");
  
            // Store the captured image and selected image source globally for later use
            window.capturedImage = capturedImage;
            window.selectedImageSrc = displayedImages[selectedTile.dataset.index];
            
            // Here you would proceed to the next state - show question interface
            setTimeout(() => {
              debug("Transitioning to question interface");
              document.getElementById('grid-interface').style.display = 'none';
              document.getElementById('question-interface').style.display = 'flex';
              // Focus on the input field
              document.getElementById('user-input').focus();
            }, 1000);
          };
          
          capturedImage.src = canvas.toDataURL('image/png');
          capturedImage.style.width = "100%";
          capturedImage.style.height = "100%";
          capturedImage.style.objectFit = "cover";
        } catch (e) {
          debug("Error during image capture: " + e.message);
        }
      }

      function startPulseAnimation() {
            const selectedGlow = document.getElementById('selected-img-glow');
            const capturedGlow = document.getElementById('captured-img-glow');
            const statusMsg = document.getElementById('generation-status');
            
            let startTime = Date.now();
            let animationFrame;
            let dotCount = 0;
            let statusMessages = [
              'Analyzing facial features',
              'Extracting key points',
              'Generating latent space',
              'Blending face attributes',
              'Applying style transfer',
              'Rendering final image'
            ];
            let currentMsgIndex = 0;
            
            function updatePulse() {
              const elapsed = Date.now() - startTime;
              
            
              // Create a sine wave with period of 2 seconds
              const intensity = Math.sin(elapsed / 2000 * Math.PI) * 0.5 + 0.5;
              
              // Apply different phases to each glow
              selectedGlow.style.backgroundColor = `rgba(255, 0, 0, ${intensity * 0.4})`;
              capturedGlow.style.backgroundColor = `rgba(255, 0, 0, ${intensity * 0.4})`;
              

              // Update the status message every 3 seconds
              if (elapsed % 3000 < 100 && elapsed > 100) {
                currentMsgIndex = (currentMsgIndex + 1) % statusMessages.length;
                dotCount = 0;
              }
              
              // Update the dots every 500ms
              if (elapsed % 500 < 100) {
                dotCount = (dotCount + 1) % 4;
              }
              

              // Update status message
              statusMsg.textContent = statusMessages[currentMsgIndex] + '.'.repeat(dotCount);
              
            
              // Continue animation
              animationFrame = requestAnimationFrame(updatePulse);
            }
            
            // Start the animation
            animationFrame = requestAnimationFrame(updatePulse);
            
            // Store the animation frame ID for later cleanup
            window.pulseAnimationFrame = animationFrame;
          }

        // Start the pulsing animation

        // Create p5 instance with a sketch function that bridges to sketch.js
        p5Instance = new p5(function(p) {
          // Store references to captured and selected images
          let p5CapturedImage;
          let p5SelectedImage;
          let workflow;
          let comfy;
          let srcImg;
          let resImg;
          let jsonFilename;
          
          p.preload = function() {
            // Load ComfyUI workflow
            workflow = p.loadJSON("latent_face_morph_workflow_controlNet_API.json");
          };
          
          p.setup = function() {
            p.createCanvas(512, 512);
            p.canvas.style.display = 'none';

            // Initialize ComfyUI helper
            comfy = new ComfyUiP5Helper(COMFY_URL);

            // 512×512 — smaller canvas = faster VAE encode/decode in ComfyUI
            srcImg = p.createGraphics(512, 512);
            
            // Load the selected image
            p5SelectedImage = p.loadImage(selectedImageSrc, () => {
              debug("Selected image loaded in p5");
              
              // Create a p5 image from the capture
              p.loadImage(capturedImage.src, (loadedCaptureImg) => {
                p5CapturedImage = loadedCaptureImg;
                debug("Captured image loaded in p5");
                
                // Generate a unique filename
                jsonFilename = 'subject_' + Math.floor(100000 + Math.random() * 900000);
                
                // Start the image generation process
                requestImage();
              });
            });
          };
          
          async function requestImage() {
            debug("Requesting ComfyUI image generation");
            
            if (!p5CapturedImage) {
              debug("No captured image available");
              showErrorInReceipt();
              return;
            }
            
            // Prepare source image for generation at 512×512
            srcImg.image(p5CapturedImage, 0, 0, 512, 512);
            
            // Replace the LoadImage node with our source image
            workflow[1] = comfy.image(srcImg);
            workflow[2] = comfy.image(p5SelectedImage);
            workflow[6].inputs.seed = Math.floor(Math.random() * 1e15);
            
            // Set the text prompt with user input
            let promptText = "person, black and white image";
            
            if (userInput && PROMPT_SERVER_URL) {
              try {
                debug("Calling prompt server with: " + userInput);
                const response = await fetch(PROMPT_SERVER_URL, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ text: userInput })
                });

                if (response.ok) {
                  const data = await response.json();
                  if (data.prompt) {
                    promptText = data.prompt + ", black and white image";
                    debug("Received enhanced prompt: " + promptText);
                  } else {
                    promptText = `${userInput} in a form of a human, black and white image`;
                  }
                } else {
                  debug("Prompt server returned status: " + response.status);
                  promptText = `${userInput} in a form of a human, black and white image`;
                }
              } catch (e) {
                debug("Error calling prompt server: " + e.message);
                promptText = `${userInput} in a form of a human, black and white image`;
              }
            } else if (userInput) {
              promptText = `${userInput} in a form of a human, black and white image`;
            }
            
            debug(`Setting prompt text to: "${promptText}"`);
            workflow[10].inputs.text = promptText;
            
            debug("Generated random seed: " + workflow[6].inputs.seed);

             // Add timeout to handle stuck requests
            let requestTimeout = setTimeout(() => {
              debug("ComfyUI request timed out after 120 seconds");
              showErrorInReceipt();
            }, 90000); // 1 min 30 sec timeout
            
            debug("Running ComfyUI workflow");
            comfy.run(workflow, (results, err) => {
              // Clear the timeout since we got a response
              clearTimeout(requestTimeout);
              gotImage(results, err);
            });
          }
          
          function gotImage(results, err) {
            debug("Got image results from ComfyUI");
  
            if (err) {
              debug("Error in ComfyUI generation: " + err);
              showErrorInReceipt();
              return;
            }
            
            if (!results) {
              debug("No results from ComfyUI");
              showErrorInReceipt();
              return;
            }
            
            if (results.length === 0) {
              debug("Empty results from ComfyUI");
              showErrorInReceipt();
              return;
            }
            
            if (!results[0] || !results[0].src) {
              debug("Invalid result format from ComfyUI");
              showErrorInReceipt();
              return;
            }
            
            debug("Successfully received generated image URL: " + results[0].src);
            // Show receipt immediately — browser loads image naturally via <img> tag
            updateReceiptWithResults(capturedImage, selectedImageSrc, results[0].src, jsonFilename);
          }

          function showErrorInReceipt() {
            debug("Showing error in receipt interface");

            // Update the receipt to show an error message
            updateReceiptWithResults(capturedImage, selectedImageSrc, null, jsonFilename);
          }
          
        }, 'p5-container');
      }

      // Initialize application
      let isInitialized = false; // Flag to prevent duplicate initialization
      function init() {
        if (isInitialized) {
          debug("Already initialized, skipping");
          return;
        }
        isInitialized = true;
        
        debug("Initializing application");
        preloadImages();
        // Sync history first so the grid shows past generations on the first render.
        // Fall back to local images immediately if sync fails or ComfyUI is offline.
        initializeGrid(); // show local images immediately while sync runs
        syncHistoryFromComfyUI(); // re-renders grid when history arrives
        setInterval(syncHistoryFromComfyUI, 30000); // re-sync every 30s so all devices stay current
        // Ensure switch camera button is available even if webcam init fails
        try { addCameraSwitchButton(); } catch(e) { debug('addCameraSwitchButton error: ' + e.message); }
        initWebcam();
        
        // Initialize BroadcastChannel for display window communication
        displayChannel = new BroadcastChannel('captcha_generation');
        
        // Add button to open display window (hidden by default; press D to toggle debug mode)
        const openDisplayBtn = document.createElement('button');
        openDisplayBtn.id = 'open-display-btn';
        openDisplayBtn.textContent = 'Open Archive Wall';
        openDisplayBtn.style.position = 'fixed';
        openDisplayBtn.style.top = '10px';
        openDisplayBtn.style.right = '10px';
        openDisplayBtn.style.zIndex = '10000';
        openDisplayBtn.style.padding = '10px 20px';
        openDisplayBtn.style.backgroundColor = '#0066cc';
        openDisplayBtn.style.color = 'white';
        openDisplayBtn.style.border = 'none';
        openDisplayBtn.style.borderRadius = '5px';
        openDisplayBtn.style.cursor = 'pointer';
        openDisplayBtn.style.display = 'none'; // hidden until debug mode

        openDisplayBtn.addEventListener('click', () => {
            window.open('archive.html', 'ArchiveWall', 'width=1200,height=800');
        });

        document.body.appendChild(openDisplayBtn);

        // Press D to toggle debug overlay buttons
        let debugMode = false;
        document.addEventListener('keydown', function(e) {
          if (e.key === 'd' || e.key === 'D') {
            debugMode = !debugMode;
            const displayBtnEl = document.getElementById('open-display-btn');
            const switchBtnEl = document.getElementById('camera-switch-btn');
            const show = debugMode ? 'block' : 'none';
            if (displayBtnEl) displayBtnEl.style.display = show;
            if (switchBtnEl) switchBtnEl.style.display = show;
            debug('Debug mode: ' + (debugMode ? 'ON' : 'OFF'));
          }
        });
        
        // Handle checkbox click
        document.getElementById('rational-checkbox').addEventListener('click', function() {
          debug("Checkbox clicked");
          this.classList.add('checked');

          const showGrid = () => {
            debug("Transitioning to grid interface");
            document.getElementById('checkbox-interface').style.display = 'none';
            document.getElementById('grid-interface').style.display = 'flex';
          };

          setTimeout(showGrid, config.checkboxWaitTime);
        });

        // Handle question input
        document.getElementById('user-input').addEventListener('keypress', function(e) {
          if (e.key === 'Enter' && !questionSubmitted) {
            e.preventDefault();
            userInput = this.value.trim();
            if (userInput) {
              debug(`User input: "${userInput}"`);
              questionSubmitted = true; // Set flag to prevent further submissions
              
              // Hide question interface immediately
              document.getElementById('question-interface').style.display = 'none';
              
              // Process the captured images and selected image
              if (window.capturedImage && window.selectedImageSrc) {
                createReceiptInterface(window.capturedImage, window.selectedImageSrc);
              } else {
                debug("Error: captured image or selected image not available");
                questionSubmitted = false; // Reset flag if there's an error
              }
            }
          }
        });
        
        // Handle shuffle button click
        document.getElementById('shuffle-button').addEventListener('click', function() {
          debug("Shuffle button clicked");
          selectedTile = null;
          clearCountdown();
          shuffleMode = true;
          initializeGrid();
        });

        // Handle question back button
        document.getElementById('question-back-button').addEventListener('click', function() {
          debug("Question back button clicked");
          document.getElementById('question-interface').style.display = 'none';
          document.getElementById('grid-interface').style.display = 'flex';
          
          document.getElementById('user-input').value = ''; // Clear input
          userInput = ""; // Reset stored input
          questionSubmitted = false; // Reset submission flag
        });

        // Handle grid back button
        document.getElementById('back-button').addEventListener('click', function() {
          debug("Grid back button clicked");
          // Clear any selected tile and countdown
          selectedTile = null;
          clearCountdown();
          
          // Show checkbox interface, hide grid interface
          document.getElementById('grid-interface').style.display = 'none';
          document.getElementById('checkbox-interface').style.display = 'flex';
          
          // Reset checkbox state
          document.getElementById('rational-checkbox').classList.remove('checked');
        });
      }
      
      // Start the application when DOM is loaded
      document.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
</html>
