<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolving Portrait: Archive</title>
  <script src="config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }

    /* The wall is radial: the collective face in the middle, stored faces in rings around it.
       Every face is a square placed by pixel size, so it can never be stretched or squashed. */
    #wall { position: fixed; inset: 0; overflow: hidden; }

    /* Each stored face floats on black inside the same soft oval as the faces in the CAPTCHA
       grid. No frames, and every face is shown at the same brightness. */
    .face, #centre { position: absolute; transform: translate(-50%, -50%); }
    .face {
      -webkit-mask-image: radial-gradient(ellipse 44.3% 51.2% at 49.8% 52.2%, #000 70%, transparent 100%);
      mask-image: radial-gradient(ellipse 44.3% 51.2% at 49.8% 52.2%, #000 70%, transparent 100%);
    }
    .face img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover;
      filter: grayscale(100%);
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .face img.visible { opacity: 1; }

    #collective { display: block; width: 100%; height: 100%; }

    #status {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.35); font-family: monospace; font-size: 11px; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="wall"></div>
  <div id="status">Loading archive…</div>

<script type="module">
import { createFaceEngine } from './src/face-engine.js';
import { createArchive } from './src/archive.js';
import { FACE_TEMPLATE } from './src/face-template.js';
import { HIDDEN_TILES } from './src/hidden-tiles.js';

// Time to turn from one face into the next: the same as on the visitor page, including a morph
// speed saved as this browser's default in the debug panel there.
let morphSpeed = 1;
try { morphSpeed = Number(JSON.parse(localStorage.getItem('ep-defaults') || '{}').morphSpeed) || 1; } catch (e) { /* no storage */ }
const MORPH_SECONDS = 3.8 / morphSpeed;
const SWAP_EVERY_MS = 4000;     // how often one wall cell changes to a different stored face
const REFRESH_EVERY_MS = 30000; // how often to look for newly contributed faces

const status = document.getElementById('status');
const wall = document.getElementById('wall');
const archive = createArchive({ url: SUPABASE_URL, key: SUPABASE_KEY });

let ids = [];            // every stored face that is not hidden
const cells = [];        // { el, img, id }
const flats = new Map(); // id -> loaded face, for the faces the morph has used
const arrivals = [];     // newly contributed faces, shown in the centre next

async function listIds() {
  // Up to 500 random visible faces from the database; hidden ones never come back.
  return (await archive.randomFaces(500)).filter((id) => !HIDDEN_TILES.has(id));
}

/** Lay out the rings of faces around the collective face in the middle. */
function buildWall() {
  const W = innerWidth, H = innerHeight, short = Math.min(W, H);
  const centreSize = Math.min(520, short * 0.56);            // the collective face
  const size = Math.max(62, Math.min(150, short / 5));        // every stored face, all the same
  wall.innerHTML = '';
  cells.length = 0;

  const place = (el, x, y, d) => {
    el.style.left = `${W / 2 + x}px`; el.style.top = `${H / 2 + y}px`;
    el.style.width = el.style.height = `${d}px`;
  };

  const centre = document.createElement('div');
  centre.id = 'centre';
  place(centre, 0, 0, centreSize);
  const canvas = document.createElement('canvas');
  canvas.id = 'collective'; canvas.width = canvas.height = 512;
  canvas.setAttribute('aria-label', 'The collective face, turning into each stored face in turn');
  centre.append(canvas);
  wall.append(centre);

  // Rings go out until they pass the corners of the screen; faces at the edges are cut off by the screen, so the wall is full.
  const reach = Math.hypot(W, H) / 2;
  const fitX = W / 2 + size * 0.4, fitY = H / 2 + size * 0.45;
  for (let ring = 0, radius = centreSize * 0.47 + size * 0.5; radius < reach; ring++, radius += size * 0.92) {
    const count = Math.floor((2 * Math.PI * radius) / (size * 0.86));
    const turn = ring % 2 ? Math.PI / count : 0;              // alternate rings sit in the gaps
    for (let i = 0; i < count; i++) {
      const angle = -Math.PI / 2 + turn + (i / count) * 2 * Math.PI;
      const x = Math.cos(angle) * radius, y = Math.sin(angle) * radius;
      if (Math.abs(x) > fitX || Math.abs(y) > fitY) continue;
      const el = document.createElement('div'); el.className = 'face';
      place(el, x, y, size);
      const img = document.createElement('img'); img.alt = '';
      el.append(img); wall.append(el);
      cells.push({ el, img, id: null });
    }
  }
  return canvas;
}

function show(cell, id) {
  cell.id = id;
  cell.img.classList.remove('visible');
  const url = archive.publicUrl(`tiles/img/${id}.jpg`);
  const pre = new Image();
  pre.onload = () => { if (cell.id === id) { cell.img.src = url; cell.img.classList.add('visible'); } };
  pre.src = url;
}

const onWall = () => new Set(cells.map((c) => c.id));
function unusedId() {
  const used = onWall();
  const free = ids.filter((id) => !used.has(id));
  const pool = free.length ? free : ids;
  return pool[Math.floor(Math.random() * pool.length)];
}

async function flatFor(id) {
  if (!flats.has(id)) {
    flats.set(id, await archive.loadFlat(id));
    if (flats.size > 40) flats.delete(flats.keys().next().value); // keep memory bounded
  }
  return flats.get(id);
}

try {
  const canvas = buildWall();
  ids = await listIds();
  if (ids.length < 2) throw new Error('not enough stored faces yet');
  cells.forEach((cell, i) => setTimeout(() => show(cell, unusedId()), i * 60));

  // Wall cells keep changing, so over time every stored face is seen.
  setInterval(() => {
    show(cells[Math.floor(Math.random() * cells.length)], unusedId());
  }, SWAP_EVERY_MS);

  // Newly contributed faces go to a wall cell and are the next face the centre turns into.
  let total = await archive.countFaces();
  let lastSeen = new Date().toISOString();
  setInterval(async () => {
    try {
      for (const row of await archive.facesSince(lastSeen)) {
        lastSeen = row.created_at;
        if (!ids.includes(row.session_id)) { ids.push(row.session_id); arrivals.push(row.session_id); total++; }
      }
    } catch (e) { /* offline for a moment: keep showing what we have */ }
  }, REFRESH_EVERY_MS);

  status.textContent = `${total} faces · starting the collective face…`;
  const engine = await createFaceEngine();
  const player = engine.createMorphPlayer(canvas, FACE_TEMPLATE);

  /** The next face for the centre: a new arrival if there is one, otherwise a face on the wall. */
  async function nextTarget() {
    for (let attempt = 0; attempt < 6; attempt++) {
      let cell;
      if (arrivals.length) {
        const id = arrivals.shift();
        cell = cells[Math.floor(Math.random() * cells.length)];
        show(cell, id);
      } else {
        const ready = cells.filter((c) => c.id && c.img.classList.contains('visible'));
        cell = ready[Math.floor(Math.random() * ready.length)];
      }
      if (!cell) { await new Promise((r) => setTimeout(r, 300)); continue; }
      try { return { cell, flat: await flatFor(cell.id) }; } catch (e) { /* try another */ }
    }
    return null;
  }

  let from = (await nextTarget()), to = (await nextTarget());
  let start = performance.now(), loading = false;
  status.textContent = `${total} faces`;
  const frame = (now) => {
    let k = (now - start) / (MORPH_SECONDS * 1000);
    if (k >= 1 && !loading) {
      loading = true;
      nextTarget().then((next) => {
        if (next) {
          player.release(from.flat);
          from = to; to = next; start = performance.now();
                  status.textContent = `${total} faces`;
        }
        loading = false;
      });
    }
    k = Math.min(1, Math.max(0, k));
    player.draw(from.flat, to.flat, k * k * (3 - 2 * k));
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  window.__wall = { ok: true, faces: total, cells: cells.length };
} catch (err) {
  console.error(err);
  status.textContent = 'Archive wall: ' + err.message;
  window.__wall = { ok: false, error: String(err && err.stack || err) };
}

addEventListener('resize', () => location.reload());
</script>
</body>
</html>
